[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catansimulator"
version = "0.1.0"
description = "Local Catan simulation and player development tools"
requires-python = ">=3.10"

[project.scripts]
catansim = "src.simulator.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.player" = ["py.typed"]
"src.platform" = ["opponents/*.pyc"]
