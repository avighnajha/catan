<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catan Simulator</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/config.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#matches"><span class="brand-icon">⬡</span> CATAN <span class="brand-sub">SIMULATOR</span></a>
    <nav aria-label="Main navigation"><a href="#matches">Matches</a><a href="#rooms">Rooms</a><a href="#bots">Player library</a></nav>
    <label class="identity">Playing as <input id="identity" aria-label="Your local player name" maxlength="80" placeholder="Your name"></label>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>SIMULATE. REWIND. UNDERSTAND.<span>Recorded matches · independent playback</span></footer>
  <div id="notice" role="status" hidden></div>
  <dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button id="closeModal" class="icon" aria-label="Close dialog">×</button></div><div id="modalBody"></div></dialog>
</body>
</html>
